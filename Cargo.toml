[package]
name = "gmod_wiki_fixer"
version = "0.1.0"
edition = "2024"

[dependencies]
glua_parser = "1.2.1"
rowan = "0.16"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
walkdir = "2.5"
clap = { version = "4.5", features = ["derive"] }

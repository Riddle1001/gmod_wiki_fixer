name: Refresh and publish wiki report

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-wiki-report
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the project
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Restore Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Restore fresh-checkable wiki page cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/pages
          key: wiki-pages-main-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wiki-pages-main-

      - name: Run the full audit
        run: cargo run --release --locked -- --pull audit --output-report index.html

      - name: Save updated wiki page cache
        uses: actions/cache/save@v4
        with:
          path: .cache/pages
          key: wiki-pages-main-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit the report when it changes
        run: |
          if git diff --quiet -- index.html; then
            echo "The report is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          git commit -m "Refresh wiki audit report"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare the standalone report
        run: |
          mkdir -p public-site
          cp index.html public-site/index.html

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
